name: FleetPulse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestration:
    name: Airflow image and DAG contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build isolated orchestration image
        run: docker build -f infra/airflow.Dockerfile -t fleetpulse-airflow:ci .
      - name: Validate real Airflow DAG imports and retry contracts
        run: docker run --rm --entrypoint python fleetpulse-airflow:ci -m orchestration.validate_dags
  full-stack:
    name: Python, PostgreSQL, .NET, Angular and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_USER: fleetpulse_admin
          # Disposable runner-only credentials, never used for a deployed database.
          POSTGRES_PASSWORD: ci-ephemeral-admin
          POSTGRES_DB: fleetpulse
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fleetpulse_admin -d fleetpulse"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_PASSWORD: ci-ephemeral-admin
      FLEETPULSE_WRITER_PASSWORD: ci-ephemeral-publisher
      FLEETPULSE_READER_PASSWORD: ci-ephemeral-reader
      FLEETPULSE_DB_HOST: 127.0.0.1
      FLEETPULSE_DB_PORT: '55432'
      FLEETPULSE_DB_NAME: fleetpulse
      FLEETPULSE_INTEGRATION: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/data/nuget-packages
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-serving-lock.txt
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.203'
          cache: true
          cache-dependency-path: backend/FleetPulse.Api/packages.lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-serving-lock.txt
          python -m pip check
          npm --prefix frontend ci
          dotnet restore backend/FleetPulse.Api --locked-mode
      - name: Build Angular and .NET
        run: |
          npm --prefix frontend run build
          dotnet build backend/FleetPulse.Api --no-restore
      - name: Test data pipelines, models, publisher and API
        run: python -m unittest discover -s tests -v
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test the complete application with isolated synthetic data
        run: python -m ci.check_browser
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
